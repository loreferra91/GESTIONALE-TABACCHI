name: Desktop isolated MongoDB certification

on:
  push:
    branches:
      - feature/desktop-hybrid-offline-sync
  pull_request:
    branches: [main]
    paths:
      - 'backend/desktop_sync/**'
      - 'backend/sales_router.py'
      - 'backend/tests/test_desktop_*'
      - 'desktop_runtime/**'
      - 'frontend/src/lib/offlineManualSale*'
      - '.github/workflows/desktop-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-replica-cert:
    name: Offline sale transaction certification (disposable Mongo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run disposable MongoDB 7 replica set
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name desktop-cert-mongo -p 127.0.0.1:27019:27017 mongo:7 \
            --replSet rsDesktopCert --bind_ip_all
          for i in $(seq 1 60); do
            if docker exec desktop-cert-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec desktop-cert-mongo mongosh --quiet --eval \
            'rs.initiate({_id:"rsDesktopCert",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 60); do
            if docker exec desktop-cert-mongo mongosh --quiet --eval \
              'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo 'MongoDB PRIMARY not available' >&2
          exit 1
      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-prod.txt
          python -m pip install pytest==9.1.1 pytest-xdist==3.8.0 mongomock-motor==0.0.36 httpx==0.28.1
      - name: Real offline sale transaction and unit tests
        env:
          CERT_DESKTOP_ALLOW_TEST: '1'
          CERT_MONGO_URL: 'mongodb://127.0.0.1:27019/?directConnection=true'
          MONGO_URL: 'mongodb://127.0.0.1:27019/?directConnection=true'
          DB_NAME: gestionale_cert_test_imports
          ENVIRONMENT: test
        run: |
          python -m compileall -q backend desktop_runtime
          python -m pytest \
            backend/tests/test_desktop_sale_replica.py \
            backend/tests/test_desktop_outbox.py \
            backend/tests/test_desktop_sync_protocol.py \
            backend/tests/test_desktop_local_runtime.py \
            backend/tests/test_desktop_staging_unit.py \
            backend/tests/test_desktop_staging_replica.py \
            backend/tests/test_desktop_escrow_lab.py \
            backend/tests/test_desktop_backup_lab.py \
            backend/tests/test_desktop_staging_sender.py \
            backend/tests/test_desktop_mongo_auth_unit.py \
            backend/tests/test_desktop_secure_runtime.py \
            -q -ra
      - name: Show isolated MongoDB logs on failure
        if: failure()
        run: docker logs --tail 160 desktop-cert-mongo
      - name: Prepare separate authenticated MongoDB laboratory
        shell: bash
        run: |
          set -euo pipefail
          docker volume create desktop-cert-auth-key
          docker run --rm -v desktop-cert-auth-key:/secure mongo:7 bash -c \
            'umask 077; head -c 384 /dev/urandom | base64 > /secure/keyfile; chmod 400 /secure/keyfile; chown mongodb:mongodb /secure/keyfile'
          docker run -d --name desktop-cert-auth --network host \
            -v desktop-cert-auth-key:/secure:ro mongo:7 \
            --port 27020 --replSet rsDesktopAuthCert \
            --keyFile /secure/keyfile --auth --bind_ip 127.0.0.1
          for i in $(seq 1 80); do
            if docker exec desktop-cert-auth mongosh --port 27020 --quiet --eval \
              'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
      - name: First-boot authenticated replica test
        env:
          CERT_DESKTOP_AUTH_ALLOW_TEST: '1'
          CERT_AUTH_MONGO_URL: 'mongodb://127.0.0.1:27020/?directConnection=true'
        run: python -m backend.tests.desktop_auth_crash_lab initialize
      - name: Simulate abrupt Mongo process crash and restart
        shell: bash
        run: |
          set -euo pipefail
          docker kill --signal=KILL desktop-cert-auth
          docker start desktop-cert-auth
          for i in $(seq 1 80); do
            if docker exec desktop-cert-auth mongosh --port 27020 --quiet --eval \
              'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
      - name: Verify authenticated recovery after crash
        env:
          CERT_DESKTOP_AUTH_ALLOW_TEST: '1'
          CERT_AUTH_MONGO_URL: 'mongodb://127.0.0.1:27020/?directConnection=true'
        run: python -m backend.tests.desktop_auth_crash_lab verify
      - name: Remove authenticated laboratory
        if: always()
        run: |
          docker rm -f desktop-cert-auth || true
          docker volume rm desktop-cert-auth-key || true
      - name: Remove disposable MongoDB
        if: always()
        run: docker rm -f desktop-cert-mongo || true
