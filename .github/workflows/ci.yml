name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-prod.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-prod.txt
          python -m pip install pytest==9.1.1 pytest-xdist==3.8.0 mongomock-motor==0.0.36

      - name: Compile backend
        run: python -m compileall -q backend -x '(^|/)(\.venv|node_modules|__pycache__)(/|$)'

      - name: Test backend
        run: python -m pytest backend/tests -q --tb=short

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Test frontend
        working-directory: frontend
        run: yarn test:ci

      - name: Build frontend
        working-directory: frontend
        run: yarn build
