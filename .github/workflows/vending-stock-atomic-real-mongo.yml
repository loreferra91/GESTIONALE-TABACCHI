name: Vending manual stock correction - real MongoDB transaction certification

on:
  push:
    branches:
      - 'feature/vending-atomic-stock-correction-*'
      - openclaw/render-staging-deploy
      - main
    paths:
      - 'backend/vending_router.py'
      - 'backend/tests/test_vending_stock_atomic.py'
      - '.github/workflows/vending-stock-atomic-real-mongo.yml'
  pull_request:
    branches:
      - openclaw/render-staging-deploy
      - main
    paths:
      - 'backend/vending_router.py'
      - 'backend/tests/test_vending_stock_atomic.py'
      - '.github/workflows/vending-stock-atomic-real-mongo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vending-atomic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: gestionale_test
      ENVIRONMENT: test
      CERT_MONGO_URL: mongodb://127.0.0.1:27017/?directConnection=true
      CERT_DB_NAME: gestionale_cert_vending_atomic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-prod.txt
      - name: Install pinned backend dependencies and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-prod.txt
          python -m pip install httpx==0.28.1 pytest==9.1.1 mongomock-motor==0.0.36
      - name: Start disposable local MongoDB replica set
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name vending-stock-cert-mongo -p 127.0.0.1:27017:27017 \
            mongo:7 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec vending-stock-cert-mongo mongosh --quiet \
              --eval 'db.adminCommand({ping:1}).ok' | grep -qx '1'; then
              break
            fi
            sleep 2
          done
          docker exec vending-stock-cert-mongo mongosh --quiet \
            --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec vending-stock-cert-mongo mongosh --quiet \
              --eval 'db.hello().isWritablePrimary' | grep -qx 'true'; then
              break
            fi
            sleep 2
          done
          docker exec vending-stock-cert-mongo mongosh --quiet \
            --eval 'if (!db.hello().isWritablePrimary) quit(2)'
      - name: Verify atomic vending correction, rejected writes and idempotent retries
        run: |
          python -m pytest -q -rs -tb=short backend/tests/test_vending_stock_atomic.py
