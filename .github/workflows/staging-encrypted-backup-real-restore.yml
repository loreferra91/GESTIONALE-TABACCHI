name: Staging encrypted backup - real disposable MongoDB restore

on:
  push:
    branches:
      - 'feature/staging-encrypted-backup-restore-cert-*'
      - 'feature/staging-25k-encrypted-recovery-drill-*'
      - openclaw/render-staging-deploy
    paths:
      - scripts/encrypted_backup.py
      - scripts/backup_health.py
      - .github/workflows/staging-encrypted-backup-real-restore.yml
  pull_request:
    branches:
      - openclaw/render-staging-deploy
    paths:
      - scripts/encrypted_backup.py
      - scripts/backup_health.py
      - .github/workflows/staging-encrypted-backup-real-restore.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypted-mongo-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Start disposable MongoDB (no Atlas credentials)
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name encrypted-backup-cert-mongo \
            -v "$RUNNER_TEMP:$RUNNER_TEMP:ro" \
            mongo:7 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec encrypted-backup-cert-mongo mongosh --quiet \
              --eval 'db.adminCommand({ping:1}).ok' | grep -qx '1'; then
              break
            fi
            sleep 2
          done
          docker exec encrypted-backup-cert-mongo mongosh --quiet \
            --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec encrypted-backup-cert-mongo mongosh --quiet \
              --eval 'db.hello().isWritablePrimary' | grep -qx 'true'; then
              break
            fi
            sleep 2
          done
          docker exec encrypted-backup-cert-mongo mongosh --quiet \
            --eval 'if (!db.hello().isWritablePrimary) quit(2)'
          docker exec encrypted-backup-cert-mongo mongodump --version
          docker exec encrypted-backup-cert-mongo mongorestore --version

      - name: Seed 25k synthetic sales, stock-consistent products and unique indexes
        shell: bash
        run: |
          set -euo pipefail
          docker exec encrypted-backup-cert-mongo mongosh --quiet --eval '
            const dbs = db.getSiblingDB("gestionale_cert_backup_source");
            dbs.prodotti.insertMany([
              {id:"P1",codice:"CERT-P1",giacenza_negozio:7,venduti_negozio:3},
              {id:"P2",codice:"CERT-P2",giacenza_negozio:11,venduti_negozio:0}
            ]);
            dbs.prodotti.createIndex({codice:1},{unique:true});
            dbs.vendite.insertMany([
              {id:"S1",batch_id:"B1",codice:"CERT-P1",quantita:2,importo:10},
              {id:"S2",batch_id:"B1",codice:"CERT-P1",quantita:1,importo:5}
            ]);
            dbs.vendite.createIndex({batch_id:1});
            dbs.cassa.insertOne({id:"C1",batch_id:"B1",tipo:"ENTRATA",importo:15});
            dbs.cassa_rapida_batches.insertOne({
              id:"B1",status:"active",pezzi:3,totale:15,movimento_cassa_id:"C1"
            });
            dbs.audit_events.insertOne({id:"A1",entita:"CERT",azione:"TEST"});
            // 25,000 synthetic native BULK sales, with consistent per-product
            // counters. This fixture contains no business or customer data.
            const fixtureProducts = [];
            for (let n = 0; n < 100; n++) {
              const code = "CERT-SCALE-P" + String(n).padStart(3, "0");
              fixtureProducts.push({
                id: code, codice: code,
                giacenza_negozio: 750, venduti_negozio: 250,
                giacenza_vending: 0, venduti_vending: 0
              });
            }
            dbs.prodotti.insertMany(fixtureProducts);
            dbs.prodotti.createIndex({id:1}, {unique:true});
            dbs.vendite.createIndex({id:1}, {unique:true});
            for (let start = 0; start < 25000; start += 500) {
              const sales = [];
              for (let n = start; n < start + 500; n++) {
                sales.push({
                  id: "CERT-SCALE-S" + String(n).padStart(6, "0"),
                  batch_id: "CERT-SCALE-BATCH", sorgente: "BULK",
                  data: "2026-11-19",
                  codice: "CERT-SCALE-P" + String(n % 100).padStart(3, "0"),
                  quantita: 1, importo: 5, pagamento: "CONTANTI"
                });
              }
              dbs.vendite.insertMany(sales);
            }
            dbs.vendite_bulk_imports.insertOne({
              id:"CERT-SCALE-BATCH",sorgente:"BULK",
              inseriti:25000,status:"active"
            });
            if (dbs.vendite.countDocuments({}) !== 25002) {
              throw Error("Large fixture failed to seed exactly 25,002 sales");
            }
          '

      - name: Generate disposable GPG key, encrypted archive and health proof
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export GNUPGHOME="$RUNNER_TEMP/cert-gpg"
          mkdir -p "$GNUPGHOME" "$RUNNER_TEMP/independent-backups"
          chmod 700 "$GNUPGHOME" "$RUNNER_TEMP/independent-backups"
          gpg --batch --pinentry-mode loopback --passphrase '' \
            --quick-generate-key 'Disposable Restore Test <restore@example.invalid>' default default never
          fingerprint=$(gpg --batch --with-colons --list-keys | awk -F: '$1=="fpr" {print $10; exit}')
          test -n "$fingerprint"
          cat > "$RUNNER_TEMP/mongodump.yaml" <<'EOF'
          uri: mongodb://127.0.0.1:27017/?directConnection=true
          EOF
          chmod 600 "$RUNNER_TEMP/mongodump.yaml"
          cat > "$RUNNER_TEMP/mongodump" <<'EOF'
          #!/usr/bin/env bash
          exec docker exec encrypted-backup-cert-mongo mongodump "$@"
          EOF
          chmod 700 "$RUNNER_TEMP/mongodump"
          export PATH="$RUNNER_TEMP:$PATH"
          python3 scripts/encrypted_backup.py \
            --db-name gestionale_cert_backup_source \
            --mongodump-config "$RUNNER_TEMP/mongodump.yaml" \
            --output-dir "$RUNNER_TEMP/independent-backups" \
            --recipient "$fingerprint" \
            --gpg-home "$GNUPGHOME"
          python3 scripts/backup_health.py \
            --directory "$RUNNER_TEMP/independent-backups" \
            --max-age-hours 1 --verify-hash

      - name: Decrypt in streaming and restore into a DIFFERENT disposable database
        shell: bash
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/cert-gpg"
          archive=$(find "$RUNNER_TEMP/independent-backups" -maxdepth 1 \
            -name '*.archive.gz.gpg' -type f -print -quit)
          test -n "$archive"
          gpg --batch --decrypt "$archive" | docker exec -i encrypted-backup-cert-mongo \
            mongorestore --archive --gzip \
              --nsFrom='gestionale_cert_backup_source.*' \
              --nsTo='gestionale_cert_backup_restored.*'

      - name: Verify exact business data and restored unique indexes
        shell: bash
        run: |
          set -euo pipefail
          docker exec encrypted-backup-cert-mongo mongosh --quiet --eval '
            const src = db.getSiblingDB("gestionale_cert_backup_source");
            const dst = db.getSiblingDB("gestionale_cert_backup_restored");
            // Compare document-by-document: do not materialize 25k+ records
            // into a single JavaScript array, even during certification.
            const expectedCounts = {
              prodotti:102, vendite:25002, cassa:1,
              cassa_rapida_batches:1, audit_events:1,
              vendite_bulk_imports:1
            };
            for (const [name, expected] of Object.entries(expectedCounts)) {
              const a = src[name].find({}, {_id:0}).sort({id:1});
              const b = dst[name].find({}, {_id:0}).sort({id:1});
              let compared = 0;
              while (a.hasNext()) {
                if (!b.hasNext()) throw Error("Missing restored row: "+name);
                if (JSON.stringify(a.next()) !== JSON.stringify(b.next())) {
                  throw Error("Restore document mismatch: "+name);
                }
                compared++;
              }
              if (b.hasNext()) throw Error("Extra restored rows: "+name);
              if (compared !== expected) throw Error("Unexpected source count: "+name+" "+compared);
            }
            const scaleSales = dst.vendite.countDocuments({
              batch_id:"CERT-SCALE-BATCH",sorgente:"BULK"
            });
            if (scaleSales !== 25000) throw Error("BULK history incomplete");
            const p = dst.prodotti.findOne({codice:"CERT-SCALE-P000"});
            if (!p || p.giacenza_negozio !== 750 || p.venduti_negozio !== 250) {
              throw Error("Product stock counters changed during recovery");
            }
            const index = dst.prodotti.getIndexes().find(x=>x.name==="codice_1");
            if (!index || !index.unique) throw Error("Missing unique product-code index");
            const salesIndex = dst.vendite.getIndexes().find(x=>x.name==="batch_id_1");
            if (!salesIndex) throw Error("Missing batch index");
            const bulkIndex = dst.vendite.getIndexes().find(x=>x.name==="id_1");
            if (!bulkIndex || !bulkIndex.unique) throw Error("Missing unique sales ID index");
            print("PASS: encrypted MongoDB restore, 25,002 sales, 6 collections, stock and indexes");
          '

      - name: Remove disposable database container and temporary keys
        if: always()
        shell: bash
        run: |
          docker rm -f encrypted-backup-cert-mongo || true
          rm -rf "$RUNNER_TEMP/cert-gpg" "$RUNNER_TEMP/independent-backups" \
                 "$RUNNER_TEMP/mongodump" "$RUNNER_TEMP/mongodump.yaml"
