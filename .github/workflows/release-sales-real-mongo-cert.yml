name: Production release candidate - isolated real MongoDB sales

on:
  push:
    branches:
      - 'feature/production-sales-integrity-backport-*'
    paths:
      - backend/sales_router.py
      - backend/cash_movements_router.py
      - backend/reconciliation.py
      - backend/tests/test_release_sales_real_mongo.py
      - .github/workflows/release-sales-real-mongo-cert.yml
  pull_request:
    branches:
      - main
    paths:
      - backend/sales_router.py
      - backend/tests/test_release_sales_real_mongo.py
      - .github/workflows/release-sales-real-mongo-cert.yml

permissions:
  contents: read

jobs:
  sales-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-prod.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-prod.txt
          python -m pip install httpx==0.28.1 pytest==9.1.1 pytest-xdist==3.8.0 mongomock-motor==0.0.36

      - name: Start disposable loopback MongoDB replica set
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name release-sales-cert-mongo \
            -p 127.0.0.1:27019:27017 \
            mongo:7 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec release-sales-cert-mongo mongosh --quiet \
              --eval 'db.adminCommand({ping:1}).ok' | grep -qx '1'; then
              break
            fi
            sleep 2
          done
          docker exec release-sales-cert-mongo mongosh --quiet \
            --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec release-sales-cert-mongo mongosh --quiet \
              --eval 'db.hello().isWritablePrimary' | grep -qx 'true'; then
              break
            fi
            sleep 2
          done
          docker exec release-sales-cert-mongo mongosh --quiet \
            --eval 'if (!db.hello().isWritablePrimary) { quit(2) }'

      - name: Execute genuine Motor transactions with isolated synthetic data
        env:
          CERT_MONGO_URL: mongodb://127.0.0.1:27019/?directConnection=true
          CERT_DB_NAME: gestionale_cert_sales_ci
          MONGO_URL: mongodb://127.0.0.1:27019/?directConnection=true
          DB_NAME: gestionale_cert_sales_ci
          ENVIRONMENT: test
        run: python -m pytest backend/tests/test_release_sales_real_mongo.py -q --tb=short -rs

      - name: Remove disposable MongoDB
        if: always()
        run: docker rm -f release-sales-cert-mongo || true
