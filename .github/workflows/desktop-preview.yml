name: Desktop Preview Installers (NOT for production)

on:
  push:
    branches: [feature/desktop-hybrid-offline-sync]
    paths:
      - 'desktop-app/**'
      - '.github/workflows/desktop-preview.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop-app/**'
      - '.github/workflows/desktop-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-preview:
    name: Preview ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - label: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
          - label: macos-intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'desktop-app/src-tauri -> target'

      - name: Generate deterministic icons
        run: |
          python -m pip install "Pillow==12.3.0"
          python desktop-app/scripts/generate_icons.py

      - name: Install Tauri CLI
        working-directory: desktop-app
        run: npm install --no-audit --no-fund

      - name: Build native diagnostic preview
        working-directory: desktop-app
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Archive installers as private workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gestionale-desktop-preview-${{ matrix.label }}
          path: |
            desktop-app/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            desktop-app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
