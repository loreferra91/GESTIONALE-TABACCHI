name: Operations integrity certification (vending, orders, Auto-Order)

on:
  push:
    branches:
      - main
      - 'feature/operations-safety-cert-*'
    paths:
      - 'backend/auto_order*.py'
      - 'backend/orders*.py'
      - 'backend/smart_venue*.py'
      - 'backend/vending*.py'
      - 'backend/server.py'
      - 'backend/tests/test_auto_order*.py'
      - 'backend/tests/test_vending*.py'
      - 'backend/tests/test_smart_venue*.py'
      - 'backend/tests/test_operation_idempotency.py'
      - '.github/workflows/production-operations-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/auto_order*.py'
      - 'backend/orders*.py'
      - 'backend/smart_venue*.py'
      - 'backend/vending*.py'
      - 'backend/server.py'
      - 'backend/tests/test_auto_order*.py'
      - 'backend/tests/test_vending*.py'
      - 'backend/tests/test_smart_venue*.py'
      - 'backend/tests/test_operation_idempotency.py'
      - '.github/workflows/production-operations-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operations-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: gestionale_cert_operations_ci
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-prod.txt
      - name: Install pinned backend dependencies and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-prod.txt
          python -m pip install httpx==0.28.1 pytest==9.1.1 pytest-xdist==3.8.0 mongomock-motor==0.0.36
      - name: Verify relevant backend modules compile
        run: python -m compileall -q backend
      - name: Certify vending transfer, Smart Venue, supplier order and Auto-Order invariants
        run: |
          python -m pytest -q --tb=short -rs \
            backend/tests/test_vending_restock.py \
            backend/tests/test_vending_cash_ledger.py \
            backend/tests/test_smart_venue_and_stock_correction.py \
            backend/tests/test_smart_venue_entry_hardening.py \
            backend/tests/test_auto_order_3_operational.py \
            backend/tests/test_auto_order_supplier_schedule.py \
            backend/tests/test_auto_order_hardening.py \
            backend/tests/test_operation_idempotency.py
